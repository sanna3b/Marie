<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Telegram</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0088cc, #005f8f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 40px 25px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            color: #222;
            margin-bottom: 12px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        .button {
            display: block;
            background: #0088cc;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        .username {
            margin-top: 18px;
            color: #0088cc;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="icon">✈️</div>

        <h1>Join My Telegram</h1>

        <p>Click the button below to join my Telegram.</p>

        <a class="button" href="https://t.me/mya6s" target="_blank">
            Join Telegram
        </a>

        <div class="username">
            @mya6s
        </div>

    </div>

</body>
</html>
